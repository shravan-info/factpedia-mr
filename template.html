<style>
  :root {
    --bg: #ffffff; --text: #111827; --text-secondary: #6b7280;
    --border: #e5e7eb; --border-light: #f3f4f6; --card-bg: #ffffff;
    --link: #2563eb; --header-bg: rgba(255,255,255,0.92); --code-bg: #f9fafb;
    --search-bg: #f9fafb;
  }
  html.dark {
    --bg: #121212; --text: #e5e7eb; --text-secondary: #9ca3af;
    --border: #2a2a2a; --border-light: #1f1f1f; --card-bg: #1e1e1e;
    --link: #60a5fa; --header-bg: rgba(18,18,18,0.92); --code-bg: #1e1e1e;
    --search-bg: #1e1e1e;
  }
    * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Noto Sans Devanagari", system-ui, -apple-system, sans-serif;
    line-height: 1.8; transition: background-color .3s, color .3s; min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 50;
    background: var(--header-bg); border-bottom: 1px solid var(--border-light);
    backdrop-filter: none; -webkit-backdrop-filter: none;
  }
  .header-inner {
    max-width: 720px; margin: 0 auto; padding: 8px 14px;
    display: flex; justify-content: space-between; align-items: center;
    height: 56px; gap: 8px;
  }
  .brand {
    position: static; transform: none; flex: 0 1 auto;
    display: inline-flex; align-items: center; gap: 7px;
    font-family: "Fraunces", Georgia, serif; font-style: italic;
    font-weight: 600; font-size: 23px; color: var(--text); text-decoration: none;
    white-space: nowrap;
  }
  .brand img { width: 27px; height: 27px; display: block; }
  .install-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; min-width: 36px; height: 36px; padding: 0;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg); color: var(--text); cursor: pointer; flex: 0 0 36px;
  }
  .install-btn span { display: none; }
  .install-btn:hover { background: var(--border-light); }
  .install-btn svg { width: 18px; height: 18px; }
  .header-actions { display: flex; align-items: center; gap: 2px; margin-left: auto; flex: 0 0 auto; }
  .icon-btn {
    width: 36px; height: 36px; display: grid; place-items: center;
    border-radius: 12px; border: 1px solid transparent;
    background: transparent; cursor: pointer; color: var(--text-secondary);
    transition: background-color .15s, border-color .15s, color .15s;
  }
  .icon-btn:hover { background: var(--border-light); color: var(--text); border-color: var(--border); }
  .icon-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .icon-btn svg { width: 20px; height: 20px; }
  .search-wrap {
    max-width: 720px; margin: 0 auto; padding: 0 20px;
    max-height: 0; overflow: hidden; opacity: 0;
    transition: max-height .18s ease, padding .18s ease;
  }
  .search-wrap.open {
    max-height: 100px; opacity: 1; padding: 12px 20px 14px;
    border-bottom: 1px solid var(--border-light);
  }
  .search-box {
    display: flex; align-items: center; gap: 10px;
    background: var(--search-bg); border: 1px solid var(--border);
    border-radius: 14px; padding: 10px 14px;
  }
  .search-box:focus-within {
    border-color: var(--link); box-shadow: 0 0 0 3px color-mix(in srgb, var(--link) 15%, transparent);
  }
  .search-box svg { width: 18px; height: 18px; color: var(--text-secondary); flex-shrink: 0; }
  .search-box input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 15px; font-family: inherit; color: var(--text);
  }
  .search-box input::placeholder { color: var(--text-secondary); }
  .search-clear {
    width: 26px; height: 26px; border-radius: 999px; border: none;
    background: var(--border-light); color: var(--text-secondary);
    cursor: pointer; display: grid; place-items: center;
  }
  .search-meta { font-size: 12px; color: var(--text-secondary); margin-top: 8px; min-height: 16px; }
  .container { max-width: 720px; margin: 0 auto; padding: 0 20px 60px; }
  main { padding-top: 28px; }
  h1 { font-size: 2.75rem; font-weight: 800; line-height: 1.15; margin: 8px 0 20px; }
  h2 { font-size: 1.65rem; font-weight: 700; margin: 36px 0 14px; }
  h3 { font-size: 1.25rem; font-weight: 700; margin: 28px 0 10px; }
  p { margin: 0 0 16px; font-size: 16px; }
  a { color: var(--link); text-decoration: none; }
  mark { background: #fef08a; color: #111827; padding: 1px 4px; border-radius: 4px; }
  html.dark mark { background: #ca8a04; color: #fefce8; }
  table {
    width: 100%; border: 1px solid var(--border); border-radius: 14px;
    border-collapse: separate; border-spacing: 0; overflow: hidden;
    margin: 20px 0 28px; background: var(--card-bg); font-size: 15px;
  }
  table td, table th { padding: 10px 14px; border-bottom: 1px solid var(--border-light); text-align: left; }
  table tr:last-child td { border-bottom: none; }
  table td:first-child { font-weight: 500; width: 42%; white-space: nowrap; }
  /* बुलेट पॉईंट्सचे सुंदर आणि योग्य अलाइनमेंट */
  ul, ol {
    padding-left: 24px;
    margin: 16px 0 24px;
  }
  li {
    margin-bottom: 10px;
    padding-left: 6px;
    line-height: 1.8;
  }
  li::marker {
    color: black; /* बुलेट्सना सुंदर निळा रंग देईल */
  }
  
  @media (max-width: 640px) { table td:first-child { white-space: normal; width: 44%; } }
  .no-results { display: none; text-align: center; padding: 30px 20px; color: var(--text-secondary); font-size: 14px; }
  .no-results.show { display: block; }
  footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border-light); font-size: 13px; color: var(--text-secondary); text-align: center; }

  /* Factpedia article refresh */
  body { background: var(--bg); }
  .container { max-width: 820px; padding-left: 28px; padding-right: 28px; }
  main { padding-top: 38px; }
  #mainContent > h1 {
    font-size: clamp(2rem, 5vw, 2.8rem); line-height: 1.3;
    letter-spacing: -.025em; padding-bottom: 18px;
    border-bottom: 1px solid var(--border); margin-bottom: 24px;
  }
  #mainContent > h2 {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    font-size: 1.45rem; line-height: 1.5; margin: 34px 0 12px;
    padding: 12px 0 10px; border-bottom: 1px solid var(--border-light);
  }
  #mainContent > h3 { font-size: 1.12rem; margin-top: 24px; }
  #mainContent p { line-height: 1.95; }
  #mainContent a { text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--link) 35%, transparent); text-underline-offset: 3px; }
  #mainContent a:hover { text-decoration-color: currentColor; }
  #mainContent blockquote {
    margin: 20px 0; padding: 14px 18px; border-left: 3px solid var(--link);
    border-radius: 0 12px 12px 0; background: var(--border-light); color: var(--text-secondary);
  }
  #mainContent img { max-width: 100%; height: auto; border-radius: 14px; }
  #mainContent pre { overflow-x: auto; padding: 16px; border-radius: 12px; background: var(--code-bg); }
  #mainContent hr { border: 0; border-top: 1px solid var(--border); margin: 28px 0; }
  #mainContent table { display: block; overflow-x: auto; }
  .section-toggle {
    flex: 0 0 30px; width: 30px; height: 30px; display: none;
    align-items: center; justify-content: center; border: 1px solid var(--border);
    border-radius: 50%; background: var(--card-bg); color: var(--text-secondary);
    font: inherit; font-size: 20px; line-height: 1; cursor: pointer;
  }
  .section-content { min-width: 0; }
  .section-content[hidden] { display: none !important; }
  @media (max-width: 700px) {
    .container { padding: 0 17px 44px; }
    main { padding-top: 24px; }
    #mainContent > h1 { font-size: 1.9rem; margin-bottom: 18px; }
    #mainContent > h2 { font-size: 1.12rem; margin: 18px 0 0; padding: 14px 0; }
    .section-toggle { display: inline-flex; }
    .section-content { padding: 12px 0 4px; }
    #mainContent p { font-size: 15px; line-height: 1.9; }
    #mainContent table { font-size: 14px; }
    footer { margin-top: 30px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .section-toggle { transition: transform .18s ease, background .18s ease; }
    .section-toggle:active { transform: scale(.94); }
  }

/* Final Wikipedia Vector-style layout: simple, readable and responsive */
:root{--bg:#fff;--text:#202122;--text-secondary:#54595d;--border:#a2a9b1;--border-light:#eaecf0;--card-bg:#fff;--link:#0645ad;--header-bg:#fff;--code-bg:#f8f9fa;--search-bg:#fff;--fp-panel:#f8f9fa}
html.dark{--bg:#202122;--text:#eaecf0;--text-secondary:#a2a9b1;--border:#54595d;--border-light:#3b3d3f;--card-bg:#202122;--link:#8ab4f8;--header-bg:#202122;--code-bg:#27292b;--search-bg:#27292b;--fp-panel:#27292b}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans Devanagari",Arial,sans-serif;font-size:14px;line-height:1.6;transition:none}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:50;background:var(--header-bg);border-bottom:1px solid var(--border-light);box-shadow:none}
.header-inner{width:100%;max-width:1440px;height:64px;margin:0 auto;padding:8px 24px;display:flex;align-items:center;justify-content:flex-start;gap:18px}
.brand{display:flex;align-items:center;gap:9px;min-width:max-content;color:var(--text);font-family:Georgia,"Noto Sans Devanagari",serif;font-size:21px;font-weight:600;letter-spacing:0}
.brand img{width:34px;height:34px;object-fit:contain;border-radius:0}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:5px}
.icon-btn{width:38px;height:38px;border:1px solid transparent;border-radius:3px;background:transparent;color:var(--text);display:grid;place-items:center}
.icon-btn:hover{background:var(--fp-panel);border-color:var(--border-light)}
.icon-btn svg{width:21px;height:21px}
.search-wrap{max-width:560px;flex:1 1 420px;margin:0;padding:0;max-height:none;opacity:1;overflow:visible}
.search-wrap.open{max-height:none;opacity:1}
.container{width:100%;max-width:1440px;margin:0 auto;padding:0 28px 48px}
main{min-width:0;padding-top:22px}
#mainContent{width:100%;max-width:960px;min-width:0;margin:0 auto}
#mainContent>*{max-width:100%}
#mainContent>h1{font-family:Georgia,"Noto Sans Devanagari",serif;font-size:clamp(1.8rem,3vw,2.15rem);font-weight:400;line-height:1.3;letter-spacing:0;margin:0 0 14px;padding:0 0 8px;border-bottom:1px solid var(--border)}
#mainContent>h2{font-family:Georgia,"Noto Sans Devanagari",serif;font-size:1.45rem;font-weight:400;line-height:1.35;margin:28px 0 10px;padding:0 0 5px;border-bottom:1px solid var(--border)}
#mainContent>h3{font-size:1.12rem;font-weight:600;margin:22px 0 8px}
#mainContent p{font-size:14px;line-height:1.75;margin:0 0 12px}
#mainContent ul,#mainContent ol{padding-left:2em;margin:8px 0 16px}
#mainContent li{padding:2px 0}
#mainContent img{max-width:100%;height:auto}
#mainContent table{width:auto;max-width:100%;border-collapse:collapse;border:1px solid var(--border);border-radius:0;box-shadow:none;font-size:14px}
#mainContent th{background:var(--fp-panel);font-weight:700}
#mainContent th,#mainContent td{border:1px solid var(--border);padding:7px 10px}
#mainContent blockquote{margin:14px 0;padding:8px 14px;border-left:3px solid var(--border);background:var(--fp-panel);border-radius:0}
footer{max-width:960px;margin:36px auto 0;padding:14px 0;border-top:1px solid var(--border-light);color:var(--text-secondary);font-size:12px}
.fp-wiki-sidebar,.fp-sidebar-scrim,.fp-menu-button,.article-toc,.fp-tool-panel,.fp-page-tabs{display:none!important}
.article-shell{display:block!important;width:100%;max-width:960px!important;margin:0 auto!important;padding:0!important}
.article-shell #mainContent{width:100%;max-width:960px;margin:0 auto}
body:not(.homepage) .container{max-width:1440px;padding:0 28px 48px}
body:not(.homepage) main{padding-top:22px}
.reading-progress{height:2px}
.search-box{border:1px solid var(--border);border-radius:3px;background:var(--search-bg);box-shadow:none}
.search-box:focus-within{border-color:var(--link);box-shadow:inset 0 0 0 1px var(--link)}
/* Homepage: encyclopedia portal, not a large app-style landing screen */
body.homepage .container{max-width:1440px;padding:0 28px 48px}
body.homepage .search-hero{max-width:960px;margin:24px auto 22px;padding:16px 18px;background:var(--fp-panel);border:1px solid var(--border-light);text-align:center}
body.homepage .hero-wordmark{font-family:Georgia,"Noto Sans Devanagari",serif;font-size:2rem;font-weight:400;line-height:1.3;letter-spacing:0;margin:0 0 4px;text-align:center}
body.homepage .hero-wordmark:after{display:none}
body.homepage .hero-tagline{font-size:13px;color:var(--text-secondary);margin:0 0 12px;text-align:center}
body.homepage .search-hero .hero-search{width:100%;max-width:620px;min-height:40px;margin:10px auto 0;padding:3px 8px;border:1px solid var(--border);border-radius:3px;background:var(--bg);box-shadow:none}
body.homepage .search-hero .hero-search input{font-size:14px;padding:7px 4px}
body.homepage .search-results{max-width:960px;margin:0 auto 20px}
body.homepage .search-result{display:block;padding:10px 4px;border:0;border-bottom:1px solid var(--border-light);border-radius:0;background:transparent;box-shadow:none}
body.homepage .search-result:hover{background:var(--fp-panel);transform:none}
body.homepage #mainContent{max-width:960px}
body.homepage #mainContent>h1{font-size:1.55rem;font-weight:600}
body.homepage #mainContent>h2{font-size:1.3rem;font-weight:600;background:var(--fp-panel);border:1px solid var(--border-light);padding:5px 9px;margin-top:22px}
body.homepage #mainContent>ol{display:block;columns:2;column-gap:38px;padding-left:28px}
body.homepage #mainContent>ol li{break-inside:avoid;padding:5px 3px;border-bottom:1px solid var(--border-light)}
body.homepage .article-count{display:flex;align-items:baseline;justify-content:flex-start;gap:8px;margin:14px 0;padding:0;border:0;background:transparent;text-align:left}
body.homepage .article-count strong{font-size:1.1rem;font-weight:700}
body.homepage .home-version{display:none!important}
body.homepage .header-inner{justify-content:flex-start}

}

<body>
<div class="reading-progress" aria-hidden="true"><span id="readingProgressBar"></span></div>
<header>
  <div class="header-inner">
    <a href="/" class="brand"><img src="/favicon.svg" alt="" width="30" height="30">Factpedia</a>
    <div class="header-actions">
      <button class="icon-btn" id="searchBtn" aria-label="Search">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
        </svg>
      </button>
      <button class="icon-btn" id="darkToggle" aria-label="Toggle theme">
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
        </svg>
        <svg id="icon-sun" style="display:none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M3 12h2.25m.386-6.364 1.591 1.591M12 12a2.25 2.25 0 0 0-2.25 2.25 2.25 2.25 0 0 0 2.25 2.25 2.25 2.25 0 0 0 2.25-2.25A2.25 2.25 0 0 0 12 12Z" />
        </svg>
      </button>
      <button class="install-btn" id="installBtn" type="button" aria-label="Install Factpedia" title="Install Factpedia">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v3h16v-3"/></svg>
        <span>Install</span>
      </button>
    </div>
  </div>
  <div class="search-wrap" id="searchWrap">
    <div class="search-box">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
      </svg>
      <input type="text" id="searchInput" placeholder="शोधा... उदा. राजधानी, भाषा, इतिहास" autocomplete="off">
      <button class="search-clear" id="searchClear" aria-label="Clear">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:14px;height:14px">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <div class="search-meta" id="searchMeta" aria-live="polite"></div>
    <div class="article-search-results" id="articleSearchResults" role="listbox" aria-label="Search results"></div>
  </div>
</header>

<div class="container">
  <main id="mainContent">
    {{content}}
  </main>
  <div class="no-results" id="noResults">कोणतेही परिणाम सापडले नाहीत 😕</div>
  <footer>© 2026 Factpedia • सर्व ज्ञानाचा एक खुला संग्रह</footer>
</div>

<script>
  (function () {
    const html = document.documentElement, darkBtn = document.getElementById('darkToggle');
    const moon = document.getElementById('icon-moon'), sun = document.getElementById('icon-sun');
    const searchBtn = document.getElementById('searchBtn'), searchWrap = document.getElementById('searchWrap');
    const searchInput = document.getElementById('searchInput'), searchClear = document.getElementById('searchClear');
    const searchMeta = document.getElementById('searchMeta'), resultsBox = document.getElementById('articleSearchResults');
    const saved = localStorage.getItem('factpedia-theme'), prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    function applyTheme(isDark) { html.classList.toggle('dark',isDark); moon.style.display=isDark?'none':'block'; sun.style.display=isDark?'block':'none'; }
    applyTheme(saved ? saved==='dark' : prefersDark);
    darkBtn.addEventListener('click',()=>{const isDark=!html.classList.contains('dark');applyTheme(isDark);localStorage.setItem('factpedia-theme',isDark?'dark':'light');});
    function openSearch(){searchWrap.classList.add('open');searchBtn.classList.add('active');setTimeout(()=>searchInput.focus(),120);}
    function closeSearch(){searchWrap.classList.remove('open');searchBtn.classList.remove('active');searchInput.value='';resultsBox.replaceChildren();resultsBox.classList.remove('has-results');searchMeta.textContent='';}
    searchBtn.addEventListener('click',()=>searchWrap.classList.contains('open')?closeSearch():openSearch());
    const normalize = value => String(value || '').toLocaleLowerCase('en').normalize('NFKC')
          .replace(/[’']/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
        let documents = [];
        let indexReady = false;
        let pendingFrame = 0;
    
        function prepareDocuments(data) {
          documents = (Array.isArray(data) ? data : []).map(doc => {
            const prepared = {
              ...doc,
              _title: normalize(doc.title),
              _aliases: normalize((doc.aliases || []).join(' ')),
              _slug: normalize(String(doc.slug || '').replace(/-/g, ' ')),
              _description: normalize(doc.description),
              _text: normalize(doc.text)
            };
            delete prepared.text;
            return prepared;
          });
          indexReady = true;
        }
    
        function scoreDocument(doc, query, tokens) {
          const title = doc._title, aliases = doc._aliases, slug = doc._slug;
          const description = doc._description, body = doc._text;
          let score = 0;
          if (title === query) score += 160;
          if (title.includes(query)) score += 95;
          if (aliases.includes(query)) score += 78;
          if (slug.includes(query)) score += 52;
          if (description.includes(query)) score += 30;
          if (body.includes(query)) score += 10;
          let matched = 0;
          for (const token of tokens) {
            if (title.includes(token) || aliases.includes(token) || slug.includes(token) ||
                description.includes(token) || body.includes(token)) matched++;
          }
          if (tokens.length && matched === tokens.length) score += 38;
          else score += matched * 4;
          return score;
        }
    
        function findSearchResults(query, limit) {
          const normalizedQuery = normalize(query);
          if (!normalizedQuery) return [];
          const tokens = normalizedQuery.split(/\s+/).filter(Boolean);
          const results = [];
          for (const doc of documents) {
            const score = scoreDocument(doc, normalizedQuery, tokens);
            if (score > 0) results.push({ doc, score });
          }
          results.sort((a, b) => b.score - a.score ||
            String(a.doc.title).localeCompare(String(b.doc.title), 'mr'));
          return results.slice(0, limit);
        }
    
        function scheduleSearch(query) {
          if (pendingFrame) cancelAnimationFrame(pendingFrame);
          pendingFrame = requestAnimationFrame(() => {
            pendingFrame = 0;
            renderSearch(query);
          });
        }
    
        fetch('/search-index.json', { cache: 'force-cache' })
          .then(response => {
            if (!response.ok) throw new Error('Search index unavailable');
            return response.json();
          })
          .then(data => {
            prepareDocuments(data);
            if (searchInput.value.trim()) renderSearch(searchInput.value);
          })
          .catch(() => {
            searchMeta.textContent = 'शोध निर्देशांक सध्या उपलब्ध नाही. कृपया पृष्ठ पुन्हा उघडा.';
          });

    function renderSearch(query) {
      const q = query.trim();
      resultsBox.replaceChildren();
      resultsBox.classList.remove('has-results');
      if (!q) { searchMeta.textContent = ''; return; }
      if (!indexReady) { searchMeta.textContent = 'लेख शोधले जात आहेत…'; return; }
      const results = findSearchResults(q, 10);
      searchMeta.textContent = results.length
        ? '“' + q + '” साठी ' + results.length + ' लेख'
        : 'लेख सापडला नाही. दुसरा शब्द वापरून पाहा.';
      const fragment = document.createDocumentFragment();
      if (!results.length) {
        const empty = document.createElement('div');
        empty.className = 'article-search-empty';
        empty.textContent = 'मराठी किंवा English मधील दुसरा शब्द वापरून पाहा.';
        fragment.append(empty);
      } else {
        for (const { doc } of results) {
          const link = document.createElement('a');
          link.className = 'article-search-result';
          link.href = doc.url;
          link.setAttribute('role', 'option');
          const title = document.createElement('strong');
          title.textContent = doc.title;
          const desc = document.createElement('span');
          desc.textContent = doc.description || 'Factpedia वरील लेख वाचा.';
          link.append(title, desc);
          fragment.append(link);
        }
      }
      resultsBox.append(fragment);
      resultsBox.classList.add('has-results');
    }
    searchInput.addEventListener('input', e => scheduleSearch(e.target.value));
    searchClear.addEventListener('click',()=>{searchInput.value='';renderSearch('');searchInput.focus();});
    document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.target.matches('input,textarea')&&!searchWrap.classList.contains('open')){e.preventDefault();openSearch();}
      if(e.key==='Escape'&&searchWrap.classList.contains('open'))closeSearch();});
  })();
</script>



<script>
  let deferredInstallPrompt = null;
  const installButton = document.getElementById("installBtn");
  if (installButton) {
    installButton.addEventListener("click", async () => {
      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        installButton.hidden = true;
      } else {
        alert("Factpedia install करण्यासाठी Chrome मेनूमधील 'Install app' किंवा 'Add to Home screen' पर्याय वापरा.");
      }
    });
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredInstallPrompt = event;
    });
    window.addEventListener("appinstalled", () => {
      installButton.hidden = true;
      deferredInstallPrompt = null;
    });
  }
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/service-worker.js").catch((error) => {
        console.error("Factpedia service worker registration failed:", error);
      });
    });
  }
</script>

<script>
(function(){
  const bar=document.getElementById('readingProgressBar');
  if(!bar)return;
  let scheduled=false;
  function update(){
    const root=document.documentElement;
    const max=root.scrollHeight-window.innerHeight;
    const progress=max>0?Math.min(100,Math.max(0,(window.scrollY/max)*100)):0;
    bar.style.width=progress+'%';
    scheduled=false;
  }
  function requestUpdate(){if(!scheduled){scheduled=true;requestAnimationFrame(update)}}
  window.addEventListener('scroll',requestUpdate,{passive:true});
  window.addEventListener('resize',requestUpdate,{passive:true});
  update();
})();
</script>
