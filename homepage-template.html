<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="index, follow, max-image-preview:large">
<meta name="author" content="Factpedia">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta property="og:type" content="{{og_type}}">
<meta property="og:site_name" content="Factpedia">
<meta property="og:locale" content="mr_IN">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="https://factpedia-mr.pages.dev/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta name="twitter:card" content="{{twitter_card}}">
<meta name="twitter:image" content="https://factpedia-mr.pages.dev/og-image.png">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<meta name="theme-color" content="#fbfaf8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Factpedia">
<script type="application/ld+json">{{schema}}</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Noto+Serif+Devanagari:wght@500;600;700&display=swap" rel="stylesheet">




<style>
:root{color-scheme:light;--bg:#fff;--surface:#fff;--surface-soft:#f8f9fa;--text:#202122;--muted:#54595d;--border:#c8ccd1;--border-soft:#eaecf0;--link:#0645ad;--accent:#3366cc;--shadow:0 1px 3px rgba(0,0,0,.06)}
html.dark{color-scheme:dark;--bg:#202122;--surface:#202122;--surface-soft:#27292b;--text:#eaecf0;--muted:#a2a9b1;--border:#54595d;--border-soft:#3b3d3f;--link:#8ab4f8;--accent:#8ab4f8;--shadow:none}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.75 "Noto Sans Devanagari",Arial,sans-serif}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border-soft)}
.header-inner{width:min(100%,1240px);height:64px;margin:auto;padding:8px 28px;display:flex;align-items:center;gap:18px}
.brand{display:inline-flex;align-items:center;gap:10px;flex:0 0 auto;color:var(--text);font-size:21px;font-weight:700;letter-spacing:-.03em}
.brand img{width:36px;height:36px;object-fit:contain}
.header-actions{display:flex;align-items:center;gap:5px;margin-left:auto}
.icon-btn{width:38px;height:38px;display:grid;place-items:center;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--text);cursor:pointer}
.icon-btn:hover{background:var(--surface-soft);border-color:var(--border-soft)}.icon-btn svg{width:20px;height:20px}
.container{width:min(100%,1240px);margin:0 auto;padding:0 28px 52px}
.search-hero{max-width:820px;margin:54px auto 42px;text-align:center}
.hero-wordmark{margin:0 0 8px;color:var(--text);font:600 clamp(2.6rem,7vw,4.2rem)/1.2 "Noto Serif Devanagari",Georgia,serif;letter-spacing:-.04em}
.hero-wordmark .version{display:block;margin-top:4px;color:var(--muted);font:400 14px/1.6 "Noto Sans Devanagari",sans-serif;letter-spacing:0}
.hero-tagline{margin:12px 0 22px;color:var(--muted);font-size:16px}
.hero-search{display:flex;align-items:center;gap:12px;max-width:760px;min-height:58px;margin:0 auto;padding:6px 8px 6px 17px;border:1px solid var(--border);border-radius:5px;background:var(--surface);box-shadow:var(--shadow)}
.hero-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 16%,transparent)}
.hero-search>svg{width:21px;height:21px;flex:0 0 auto;color:var(--muted)}
.hero-search input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:15px "Noto Sans Devanagari",sans-serif}
.hero-search input::placeholder{color:var(--muted)}
.hero-search-go{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border:0;border-radius:4px;background:var(--accent);color:#fff;cursor:pointer}
.hero-search-go:hover{filter:brightness(.94)}.hero-search-go svg{width:19px;height:19px}
.search-hint{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;margin-top:15px;color:var(--muted);font-size:13px}
.search-hint a{padding:4px 10px;border:1px solid var(--border-soft);border-radius:4px;background:var(--surface-soft);color:var(--link)}
.search-results{max-width:820px;margin:0 auto 34px}.search-results[hidden]{display:none}
.results-heading{margin:0 0 10px;color:var(--muted);font-size:13px}.result-list{display:grid;gap:0}
.search-result{display:block;padding:12px 6px;border-bottom:1px solid var(--border-soft);background:transparent;color:var(--text)}
.search-result strong{display:block;margin-bottom:3px;color:var(--link);font-size:16px;font-weight:600}
.search-result span{display:block;color:var(--muted);font-size:13px;line-height:1.65}
.search-result:hover{background:var(--surface-soft);text-decoration:none}
#mainContent{max-width:960px;margin:0 auto}
#mainContent>h1{margin:30px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);font:500 clamp(1.65rem,3vw,2rem)/1.35 "Noto Serif Devanagari",serif}
#mainContent>h2{margin:30px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--border);font:600 1.35rem/1.4 "Noto Serif Devanagari",serif}
#mainContent>h3{margin:22px 0 8px;font-size:1.08rem}
#mainContent p{max-width:900px;margin:0 0 14px;color:var(--text);line-height:1.85}
#mainContent ol,#mainContent ul{padding-left:28px;margin:10px 0 22px}
#mainContent li{padding:4px 2px;border-bottom:1px solid var(--border-soft)}
#mainContent li:last-child{border-bottom:0}
#mainContent table{max-width:100%;border-collapse:collapse}#mainContent th,#mainContent td{padding:8px 11px;border:1px solid var(--border)}#mainContent th{background:var(--surface-soft)}
.article-count{display:flex;align-items:baseline;gap:9px;width:max-content;max-width:100%;margin:18px 0 22px;padding:7px 12px;border:1px solid var(--border-soft);background:var(--surface-soft)}
.article-count strong{font-size:1.25rem;font-weight:700}.article-count span{color:var(--muted);font-size:13px}
.fp-home-explore{margin:32px auto 12px}
.fp-home-section-head{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.fp-home-section-head>div>span{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em}
.fp-home-section-head h2{margin:3px 0 0!important;padding:0!important;border:0!important;font-size:1.4rem!important}
.fp-home-section-head>a{font-size:13px;white-space:nowrap}
.fp-home-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fp-home-card{display:flex;min-height:120px;flex-direction:column;justify-content:space-between;padding:14px;border:1px solid var(--border-soft);background:var(--surface);color:var(--text)!important;transition:border-color .15s,background .15s}
.fp-home-card:hover{border-color:var(--accent);background:var(--surface-soft);text-decoration:none}
.fp-home-card-kicker{color:var(--muted);font-size:11px}.fp-home-card strong{font:600 16px/1.5 "Noto Serif Devanagari",serif}
.fp-home-card>span:last-child{color:var(--link);font-size:12px}
.fp-home-category{margin-top:24px}.fp-home-category h2{margin:0 0 10px!important;padding:0!important;border:0!important;font-size:1.15rem!important}
.fp-home-category>div{display:flex;flex-wrap:wrap;gap:7px}.fp-home-category a{padding:5px 10px;border:1px solid var(--border-soft);background:var(--surface-soft);font-size:13px}
footer{max-width:960px;margin:36px auto 0;padding:15px 0;border-top:1px solid var(--border-soft);color:var(--muted);font-size:12px}
.no-results{display:none}.no-results.show{display:block}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(max-width:900px){.fp-home-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){
.header-inner{height:56px;padding:7px 14px;gap:8px}.brand{font-size:18px;gap:7px}.brand img{width:31px;height:31px}.icon-btn{width:35px;height:35px}
.container{padding:0 15px 38px}.search-hero{margin:34px auto 30px}.hero-wordmark{font-size:2.7rem}
.hero-tagline{font-size:14px;margin:8px 0 17px}.hero-search{min-height:53px;padding-left:12px;gap:8px}
.hero-search input{font-size:14px}.hero-search-go{width:38px;height:38px;flex-basis:38px}
.search-hint{gap:6px;font-size:12px}.search-hint a{padding:4px 8px}
#mainContent>h1{font-size:1.55rem}#mainContent>h2{font-size:1.2rem}#mainContent p{font-size:14px}
.fp-home-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.fp-home-card{min-height:108px;padding:10px}.fp-home-card strong{font-size:14px}
.fp-home-section-head h2{font-size:1.2rem!important}.fp-home-section-head>a{font-size:11px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body class="homepage">
<header>
  <div class="header-inner">
    <a href="/" class="brand" aria-label="Factpedia मुख्यपृष्ठ"><img src="/favicon.svg" alt="" width="34" height="34">Factpedia</a>
    <div class="header-actions">
      <button class="icon-btn" id="searchBtn" aria-label="Search">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
        </svg>
      </button>
      <button class="icon-btn" id="darkToggle" aria-label="Toggle theme">
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
        </svg>
        <svg id="icon-sun" style="display:none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M3 12h2.25m.386-6.364 1.591 1.591M12 12a2.25 2.25 0 0 0-2.25 2.25 2.25 2.25 0 0 0 2.25 2.25 2.25 2.25 0 0 0 2.25-2.25A2.25 2.25 0 0 0 12 12Z" />
        </svg>
      </button>
    </div>
  </div>
</header>

<div class="container">
  <section class="search-hero" aria-label="Factpedia article search">
    <div class="hero-wordmark">Factpedia <span class="version">मराठी मुक्त ज्ञानकोश</span></div>
    <p class="hero-tagline">आज तुम्हाला काय जाणून घ्यायचे आहे?</p>
    <div class="hero-search">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><path stroke-linecap="round" stroke-linejoin="round" d="m16.5 16.5 4 4"/></svg>
      <input id="searchInput" type="search" placeholder="काहीही शोधा किंवा प्रश्न विचारा..." autocomplete="off" aria-label="Search Factpedia articles">
      <button type="button" class="hero-search-go" id="searchGo" aria-label="शोध सुरू करा">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
      </button>
    </div>
    <div class="search-hint"><span>ट्रेंडिंग</span><a href="/bharat/">भारत</a><a href="/artificial-intelligence/">कृत्रिम बुद्धिमत्ता</a><a href="/chandrayaan-3/">चांद्रयान-३</a></div>
  </section>
  <section class="search-results" id="searchResults" aria-live="polite" hidden>
    <p class="results-heading" id="searchMeta"></p>
    <div class="result-list" id="resultList"></div>
  </section>
  <div class="home-version" aria-label="Website version">Factpedia</div>
  <main id="mainContent">
    {{content}}
  </main>
  <div class="no-results" id="noResults">कोणतेही परिणाम सापडले नाहीत 😕</div>
  <footer>© 2026 Factpedia • सर्व ज्ञानाचा एक खुला संग्रह</footer>
</div>

<script>
  (function() {
    const html = document.documentElement;
    const darkBtn = document.getElementById('darkToggle');
    const moon = document.getElementById('icon-moon');
    const sun = document.getElementById('icon-sun');
    const searchBtn = document.getElementById('searchBtn');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const searchMeta = document.getElementById('searchMeta');
    const resultList = document.getElementById('resultList');
    const saved = localStorage.getItem('factpedia-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    function applyTheme(isDark) {
      html.classList.toggle('dark', isDark);
      moon.style.display = isDark ? 'none' : 'block';
      sun.style.display = isDark ? 'block' : 'none';
    }
    applyTheme(saved ? saved === 'dark' : prefersDark);
    darkBtn.addEventListener('click', () => {
      const isDark = !html.classList.contains('dark');
      applyTheme(isDark);
      localStorage.setItem('factpedia-theme', isDark ? 'dark' : 'light');
    });
    searchBtn.addEventListener('click', () => {
      searchInput.focus();
      searchInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    let documents = [];
    let prepared = [];
    let prefixIndex = new Map();
    let bodyPrefixIndex = new Map();
    let indexReady = false;
    const MAX_PREFIX = 10;
    let indexPromise = null;
    function loadSearchIndex() {
      if (indexPromise) return indexPromise;
      indexPromise = fetch('/search-index.json')
        .then(response => { if (!response.ok) throw new Error('Search index unavailable'); return response.json(); })
        .then(data => { documents = Array.isArray(data) ? data : []; buildIndex(); indexReady = true; if (searchInput.value.trim()) renderSearch(searchInput.value); })
        .catch(() => { indexPromise = null; searchMeta.textContent = 'शोध निर्देशांक सध्या उपलब्ध नाही. कृपया पुन्हा प्रयत्न करा.'; });
      return indexPromise;
    }
    searchInput.addEventListener('focus', loadSearchIndex);
    const normalize = value => String(value || '').toLocaleLowerCase('en').normalize('NFKC')
      .replace(/[’']/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
    // Pre-compute normalised fields and a prefix index once, so typing never
    // re-normalises 500+ documents on every keystroke.
    function buildIndex() {
      prepared = documents.map(doc => {
        const title = normalize(doc.title);
        const aliases = normalize((doc.aliases || []).join(' '));
        const slug = normalize(String(doc.slug || '').replace(/-/g, ' '));
        const description = normalize(doc.description);
        const text = normalize(doc.text);
        const heads = new Set([...title.split(' '), ...aliases.split(' '), ...slug.split(' ')].filter(Boolean));
        return { doc, title, aliases, slug, description, text, heads };
      });
      prefixIndex = new Map();
      bodyPrefixIndex = new Map();
      prepared.forEach((entry, i) => {
        entry.heads.forEach(token => {
          const limit = Math.min(token.length, MAX_PREFIX);
          for (let len = 1; len <= limit; len++) {
            const key = token.slice(0, len);
            const bucket = prefixIndex.get(key);
            if (bucket) bucket.push(i); else prefixIndex.set(key, [i]);
          }
        });
        const indexedPrefixes = new Set();
        for (const token of entry.text.split(/\\s+/)) {
          const chars = Array.from(token);
          if (chars.length < 3) continue;
          const key = chars.slice(0, 3).join('');
          if (indexedPrefixes.has(key)) continue;
          indexedPrefixes.add(key);
          const bucket = bodyPrefixIndex.get(key);
          if (bucket) bucket.push(i); else bodyPrefixIndex.set(key, [i]);
        }
      });
    }
    function scoreEntry(entry, q, tokens) {
      const { title, aliases, slug, description, text } = entry;
      let score = 0;
      if (title === q) score += 160;
      if (title.startsWith(q)) score += 90;
      if (title.includes(q)) score += 80;
      if (aliases.includes(q)) score += 65;
      if (slug.includes(q)) score += 45;
      if (description.includes(q)) score += 25;
      if (text.includes(q)) score += 12;
      let matched = 0;
      for (const token of tokens) {
        if (entry.heads.has(token)) matched += 2;
        else if (title.includes(token) || aliases.includes(token) || slug.includes(token) || description.includes(token) || text.includes(token)) matched += 1;
      }
      if (matched >= tokens.length * 2) score += 40;
      else if (matched > 0) score += matched * 3;
      return score;
    }
    function candidateIds(tokens) {
      // Search every query term. Returning only the smallest bucket caused
      // multi-word searches to miss articles matching another term.
      const candidates = new Set();
      let foundBucket = false;
      for (const token of tokens) {
        const key = Array.from(token).slice(0, MAX_PREFIX).join('');
        const bodyKey = Array.from(token).slice(0, 3).join('');
        const headBucket = prefixIndex.get(key);
        const bodyBucket = Array.from(token).length >= 3 ? bodyPrefixIndex.get(bodyKey) : null;
        for (const bucket of [headBucket, bodyBucket]) {
          if (!bucket) continue;
          foundBucket = true;
          for (const id of bucket) candidates.add(id);
        }
      }
      return foundBucket ? candidates : null;
    }
    function renderSearch(query) {
      const q = query.trim();
      if (!q) {
        searchResults.hidden = true;
        resultList.replaceChildren();
        return;
      }
      searchResults.hidden = false;
      if (!indexReady) {
        searchMeta.textContent = 'लेख शोधले जात आहेत...';
        return;
      }
      const normalizedQuery = normalize(q);
      const tokens = normalizedQuery.split(' ').filter(Boolean);
      if (!tokens.length) { searchMeta.textContent = 'शोधण्यासाठी अक्षरे किंवा शब्द टाइप करा.'; resultList.replaceChildren(); return; }
      const candidates = candidateIds(tokens);
      const pool = candidates && candidates.size ? candidates : prepared.map((_, i) => i);
      const results = [];
      for (const i of pool) {
        const entry = prepared[i];
        if (!entry) continue;
        const score = scoreEntry(entry, normalizedQuery, tokens);
        if (score > 0) results.push({ doc: entry.doc, score });
      }
      results.sort((a, b) => b.score - a.score || a.doc.title.localeCompare(b.doc.title, 'mr'));
      results.length = Math.min(results.length, 12);
      searchMeta.textContent = results.length
        ? '“' + q + '” साठी ' + results.length + ' संबंधित लेख'
        : '“' + q + '” साठी लेख सापडला नाही. वेगळा शब्द वापरून पाहा.';
      resultList.replaceChildren();
      results.forEach(({doc}) => {
        const link = document.createElement('a');
        link.className = 'search-result';
        link.href = doc.url;
        const title = document.createElement('strong');
        title.textContent = doc.title;
        const desc = document.createElement('span');
        desc.textContent = doc.description || 'Factpedia वरील माहितीपूर्ण लेख वाचा.';
        link.append(title, desc);
        resultList.append(link);
      });
    }
    let pendingFrame = 0;
    searchInput.addEventListener('input', event => {
      const value = event.target.value;
      if (pendingFrame) cancelAnimationFrame(pendingFrame);
      pendingFrame = requestAnimationFrame(() => {
        pendingFrame = 0;
        renderSearch(value);
      });
    });
    searchInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') { if (pendingFrame) cancelAnimationFrame(pendingFrame); pendingFrame = 0; renderSearch(searchInput.value); }
    });
    const searchGo = document.getElementById('searchGo');
    if (searchGo) searchGo.addEventListener('click', () => {
      if (searchInput.value.trim()) { renderSearch(searchInput.value); searchResults.scrollIntoView({behavior:'smooth',block:'start'}); }
      else searchInput.focus();
    });
    document.addEventListener('keydown', event => {
      if (event.key === '/' && !event.target.matches('input,textarea')) {
        event.preventDefault(); searchInput.focus();
      }
      if (event.key === 'Escape' && document.activeElement === searchInput) {
        searchInput.value = ''; renderSearch('');
      }
    });
  })();
</script>



</body>
</html>
