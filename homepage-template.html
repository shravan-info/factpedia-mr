<style>
  :root {
    --bg: #ffffff; --text: #111827; --text-secondary: #6b7280;
    --border: #e5e7eb; --border-light: #f3f4f6; --card-bg: #ffffff;
    --link: #2563eb; --header-bg: rgba(255,255,255,0.92); --code-bg: #f9fafb;
    --search-bg: #f9fafb;
  }
  html.dark {
    --bg: #121212; --text: #e5e7eb; --text-secondary: #9ca3af;
    --border: #2a2a2a; --border-light: #1f1f1f; --card-bg: #1e1e1e;
    --link: #60a5fa; --header-bg: rgba(18,18,18,0.92); --code-bg: #1e1e1e;
    --search-bg: #1e1e1e;
  }
    * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Noto Sans Devanagari", system-ui, -apple-system, sans-serif;
    line-height: 1.8; transition: background-color .3s, color .3s; min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 50;
    background: var(--header-bg); border-bottom: 1px solid var(--border-light);
    backdrop-filter: none; -webkit-backdrop-filter: none;
  }
  .header-inner {
    max-width: 720px; margin: 0 auto; padding: 8px 14px;
    display: flex; justify-content: space-between; align-items: center;
    height: 56px; gap: 8px;
  }
  .brand {
    position: static; transform: none; flex: 0 1 auto;
    display: inline-flex; align-items: center; gap: 7px;
    font-family: "Fraunces", Georgia, serif; font-style: italic;
    font-weight: 600; font-size: 23px; color: var(--text); text-decoration: none;
    white-space: nowrap;
  }
  .brand img { width: 27px; height: 27px; display: block; }
  .install-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; min-width: 36px; height: 36px; padding: 0;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--bg); color: var(--text); cursor: pointer; flex: 0 0 36px;
  }
  .install-btn span { display: none; }
  .install-btn:hover { background: var(--border-light); }
  .install-btn svg { width: 18px; height: 18px; }
  .header-actions { display: flex; align-items: center; gap: 2px; margin-left: auto; flex: 0 0 auto; }
  .icon-btn {
    width: 36px; height: 36px; display: grid; place-items: center;
    border-radius: 12px; border: 1px solid transparent;
    background: transparent; cursor: pointer; color: var(--text-secondary);
    transition: all .2s;
  }
  .icon-btn:hover { background: var(--border-light); color: var(--text); border-color: var(--border); }
  .icon-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); }
  .icon-btn svg { width: 20px; height: 20px; }
  .search-wrap {
    max-width: 720px; margin: 0 auto; padding: 0 20px;
    max-height: 0; overflow: hidden; opacity: 0;
    transition: all 0.3s ease;
  }
  .search-wrap.open {
    max-height: 100px; opacity: 1; padding: 12px 20px 14px;
    border-bottom: 1px solid var(--border-light);
  }
  .search-box {
    display: flex; align-items: center; gap: 10px;
    background: var(--search-bg); border: 1px solid var(--border);
    border-radius: 14px; padding: 10px 14px;
  }
  .search-box:focus-within {
    border-color: var(--link); box-shadow: 0 0 0 3px color-mix(in srgb, var(--link) 15%, transparent);
  }
  .search-box svg { width: 18px; height: 18px; color: var(--text-secondary); flex-shrink: 0; }
  .search-box input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 15px; font-family: inherit; color: var(--text);
  }
  .search-box input::placeholder { color: var(--text-secondary); }
  .search-clear {
    width: 26px; height: 26px; border-radius: 999px; border: none;
    background: var(--border-light); color: var(--text-secondary);
    cursor: pointer; display: grid; place-items: center;
  }
  .search-meta { font-size: 12px; color: var(--text-secondary); margin-top: 8px; min-height: 16px; }
  .container { max-width: 720px; margin: 0 auto; padding: 0 20px 60px; }
  main { padding-top: 28px; }
  h1 { font-size: 2.75rem; font-weight: 800; line-height: 1.15; margin: 8px 0 20px; }
  h2 { font-size: 1.65rem; font-weight: 700; margin: 36px 0 14px; }
  h3 { font-size: 1.25rem; font-weight: 700; margin: 28px 0 10px; }
  p { margin: 0 0 16px; font-size: 16px; }
  a { color: var(--link); text-decoration: none; }
  mark { background: #fef08a; color: #111827; padding: 1px 4px; border-radius: 4px; }
  html.dark mark { background: #ca8a04; color: #fefce8; }
  table {
    width: 100%; border: 1px solid var(--border); border-radius: 14px;
    border-collapse: separate; border-spacing: 0; overflow: hidden;
    margin: 20px 0 28px; background: var(--card-bg); font-size: 15px;
  }
  table td, table th { padding: 10px 14px; border-bottom: 1px solid var(--border-light); text-align: left; }
  table tr:last-child td { border-bottom: none; }
  table td:first-child { font-weight: 500; width: 42%; white-space: nowrap; }
  /* बुलेट पॉईंट्सचे सुंदर आणि योग्य अलाइनमेंट */
  ul, ol {
    padding-left: 24px;
    margin: 16px 0 24px;
  }
  li {
    margin-bottom: 10px;
    padding-left: 6px;
    line-height: 1.8;
  }
  li::marker {
    color: black; /* बुलेट्सना सुंदर निळा रंग देईल */
  }
  
  @media (max-width: 640px) { table td:first-child { white-space: normal; width: 44%; } }
  .no-results { display: none; text-align: center; padding: 30px 20px; color: var(--text-secondary); font-size: 14px; }
  .no-results.show { display: block; }
  footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border-light); font-size: 13px; color: var(--text-secondary); text-align: center; }

  /* Homepage-only refinements; article pages keep template.html unchanged. */
  .homepage .home-version {
    display: flex; align-items: center; justify-content: center;
    width: fit-content; margin: 8px auto 14px; padding: 4px 10px;
    border: 1px solid var(--border); border-radius: 999px;
    color: var(--text-secondary); background: var(--card-bg);
    font-size: 12px; font-weight: 500; letter-spacing: .02em;
  }
  .homepage main { padding-top: 18px; }
  .homepage #mainContent > h1 {
    text-align: center; font-size: clamp(2.4rem, 8vw, 3.25rem);
    letter-spacing: -.035em; margin: 8px 0 12px;
  }
  .homepage #mainContent > h1 + p {
    max-width: 620px; margin: 0 auto 30px; text-align: center;
    color: var(--text-secondary); font-size: 16px; line-height: 1.9;
  }
  .homepage #mainContent > h2 {
    margin-top: 34px; padding-bottom: 10px;
    border-bottom: 1px solid var(--border-light);
  }
  .homepage #mainContent > ol {
    list-style-position: inside; padding: 0; margin: 16px 0 28px;
    border: 1px solid var(--border); border-radius: 16px;
    overflow: hidden; background: var(--card-bg);
  }
  .homepage #mainContent > ol li {
    margin: 0; padding: 11px 16px; line-height: 1.75;
    border-bottom: 1px solid var(--border-light);
  }
  .homepage #mainContent > ol li:last-child { border-bottom: 0; }
  .homepage #mainContent > ol li::marker { color: var(--text-secondary); font-weight: 700; }
  .homepage #mainContent > ol li a { font-weight: 500; }
  .homepage #mainContent > ol li:hover { background: var(--border-light); }
  .homepage .article-count {
    display: flex; flex-direction: column; align-items: center;
    gap: 2px; margin: 28px auto 8px; padding: 18px 24px;
    max-width: 260px; border: 1px solid var(--border);
    border-radius: 16px; background: var(--card-bg); text-align: center;
  }
  .homepage .article-count strong {
    color: var(--text); font-size: 2.25rem; line-height: 1.25;
    font-weight: 800; font-variant-numeric: tabular-nums;
  }
  .homepage .article-count span { color: var(--text-secondary); font-size: 13px; }
  @media (max-width: 640px) {
    .homepage #mainContent > h1 + p { font-size: 15px; }
    .homepage #mainContent > ol li { padding: 10px 12px; }
  }

  /* Search-first encyclopedia home */
  .homepage .container { max-width: 1040px; padding-left: 24px; padding-right: 24px; }
  .homepage .home-version { display: none; }
  .homepage .search-hero {
    max-width: 780px; margin: 42px auto 34px; padding: 0 4px; text-align: center;
  }
  .homepage .search-kicker {
    color: var(--link); font-size: 12px; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; margin-bottom: 10px;
  }
  .homepage .search-hero .hero-title {
    font-size: clamp(1.8rem, 5vw, 2.65rem); line-height: 1.25;
    margin: 0 0 12px; letter-spacing: -.035em;
  }
  .homepage .search-hero p { color: var(--text-secondary); margin: 0 auto 22px; max-width: 600px; }
  .homepage .hero-search {
    display: flex; align-items: center; gap: 12px; padding: 7px 9px 7px 18px;
    border: 1px solid var(--border); border-radius: 18px; background: var(--card-bg);
    box-shadow: 0 10px 35px rgba(15,23,42,.07); text-align: left;
  }
  html.dark .homepage .hero-search { box-shadow: 0 10px 35px rgba(0,0,0,.2); }
  .homepage .hero-search:focus-within { border-color: var(--link); box-shadow: 0 0 0 4px color-mix(in srgb, var(--link) 13%, transparent); }
  .homepage .hero-search svg { width: 22px; height: 22px; color: var(--text-secondary); flex: 0 0 auto; }
  .homepage .hero-search input {
    width: 100%; min-width: 0; border: 0; outline: 0; background: transparent;
    color: var(--text); font: inherit; font-size: 16px; padding: 11px 0;
  }
  .homepage .hero-search input::placeholder { color: var(--text-secondary); }
  .homepage .search-hint { color: var(--text-secondary); font-size: 12px; margin-top: 12px; }
  .homepage .search-results { max-width: 780px; margin: 0 auto 34px; }
  .homepage .search-results[hidden] { display: none; }
  .homepage .results-heading { color: var(--text-secondary); font-size: 13px; margin: 0 0 10px; }
  .homepage .result-list { display: grid; gap: 10px; }
  .homepage .search-result {
    display: block; padding: 16px 18px; border: 1px solid var(--border);
    border-radius: 14px; background: var(--card-bg); color: var(--text);
    transition: border-color .15s, transform .15s;
  }
  .homepage .search-result:hover { border-color: var(--link); transform: translateY(-1px); }
  .homepage .search-result strong { display: block; color: var(--link); font-size: 17px; margin-bottom: 4px; }
  .homepage .search-result span { display: block; color: var(--text-secondary); font-size: 13px; line-height: 1.65; }
  .homepage .browse-heading {
    margin-top: 40px !important; font-size: 1.45rem !important;
    border-bottom: 1px solid var(--border-light); padding-bottom: 12px;
  }
  .homepage #mainContent > h1 { font-size: clamp(2.1rem, 6vw, 3rem); }
  .homepage #mainContent > h1 + p { max-width: 680px; }
  .homepage .search-wrap { display: none; }
  @media (max-width: 640px) {
    .homepage .container { padding-left: 16px; padding-right: 16px; }
    .homepage .search-hero { margin: 28px auto 26px; }
    .homepage .hero-search { border-radius: 14px; padding-left: 13px; }
    .homepage .search-result { padding: 14px; }
  }


  /* Factpedia homepage visual refresh */
  body.homepage { background: var(--bg); }
  .homepage .header-inner { max-width: 1080px; height: 62px; padding-left: 22px; padding-right: 22px; }
  .homepage .brand { font-size: 25px; letter-spacing: -.03em; }
  .homepage .container { max-width: 1080px; }
  .homepage .search-hero {
    max-width: 820px; margin: 54px auto 38px; padding: 0 8px;
  }
  .homepage .search-kicker {
    display: inline-flex; padding: 6px 12px; border: 1px solid var(--border);
    border-radius: 999px; background: var(--card-bg); letter-spacing: .04em;
  }
  .homepage .search-hero .hero-title {
    font-weight: 800; letter-spacing: -.045em;
    font-size: clamp(2rem, 5.4vw, 3.15rem);
  }
  .homepage .hero-search {
    min-height: 66px; border-radius: 20px; padding: 9px 18px;
    box-shadow: 0 14px 42px rgba(15,23,42,.09);
  }
  .homepage .hero-search input { font-size: 17px; }
  .homepage .search-hint { line-height: 1.8; }
  .homepage .search-results { max-width: 820px; }
  .homepage .result-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .homepage .search-result {
    min-height: 104px; padding: 18px; border-radius: 16px;
    box-shadow: 0 2px 10px rgba(15,23,42,.025);
  }
  .homepage .search-result strong { font-size: 16px; }
  .homepage #mainContent { max-width: 820px; margin: 0 auto; }
  .homepage #mainContent > h1 { text-align: center; }
  .homepage #mainContent > h2 {
    font-size: 1.35rem; margin-top: 38px; padding-bottom: 12px;
  }
  .homepage #mainContent > ol { border-radius: 18px; }
  .homepage #mainContent > ol li { padding: 13px 18px; }
  .homepage footer { max-width: 820px; margin-left: auto; margin-right: auto; }
  @media (max-width: 640px) {
    .homepage .header-inner { height: 58px; padding-left: 16px; padding-right: 16px; }
    .homepage .container { padding-left: 16px; padding-right: 16px; }
    .homepage .search-hero { margin: 34px auto 28px; padding: 0; }
    .homepage .search-hero .hero-title { font-size: 2rem; }
    .homepage .hero-search { min-height: 58px; border-radius: 15px; }
    .homepage .hero-search input { font-size: 15px; }
    .homepage .result-list { grid-template-columns: 1fr; gap: 9px; }
    .homepage .search-result { min-height: 0; padding: 14px 15px; }
    .homepage #mainContent > h2 { font-size: 1.2rem; margin-top: 30px; }
  }


  /* Factpedia visual system refresh */
  :root { --bg:#f7f9fd; --text:#17243b; --text-secondary:#65748b; --border:#dce5f2; --border-light:#eaf0f8; --card-bg:#fff; --link:#2457c5; --header-bg:rgba(255,255,255,.9); --code-bg:#f1f5fb; --search-bg:#f4f7fc; --accent-soft:#eaf1ff; --accent-strong:#1746a2; }
  html.dark { --bg:#0d1422; --text:#e8eef9; --text-secondary:#a1aec2; --border:#263650; --border-light:#1b2940; --card-bg:#121e30; --link:#82adff; --header-bg:rgba(13,20,34,.9); --code-bg:#142238; --search-bg:#142238; --accent-soft:#1a3157; --accent-strong:#9bbcff; }
  body { background:var(--bg); }
  header { border-bottom-color:var(--border); box-shadow:0 4px 22px rgba(21,48,91,.035); }
  .header-inner { max-width:980px; height:68px; padding:8px 22px; }
  .brand { gap:10px; font-family:"Noto Sans Devanagari",system-ui,sans-serif; font-style:normal; font-weight:800; letter-spacing:-.045em; font-size:24px; }
  .brand img { width:34px; height:34px; border-radius:10px; }
  .icon-btn { width:40px; height:40px; border-radius:13px; }
  .icon-btn:hover { color:var(--link); background:var(--accent-soft); border-color:var(--border); }
  .icon-btn.active { color:#fff; background:var(--accent-strong); border-color:var(--accent-strong); }
  a { color:var(--link); } li::marker { color:var(--link); }
  #mainContent > h1,#mainContent > h2 { color:var(--text); }
  .search-box,.hero-search { border-color:var(--border); }
  .search-box:focus-within,.hero-search:focus-within { border-color:var(--link); }
  .install-btn { border-radius:12px; border-color:var(--border); }
  footer { color:var(--text-secondary); }

  .homepage .search-hero { margin-top:64px; margin-bottom:44px; }
  .homepage .search-kicker { color:var(--link); background:var(--accent-soft); border-color:transparent; font-weight:700; }
  .homepage .search-hero .hero-title { color:var(--text); line-height:1.3; }
  .homepage .hero-search { border-radius:22px; border-color:var(--border); box-shadow:0 18px 48px rgba(28,63,120,.10); }
  html.dark .homepage .hero-search { box-shadow:0 18px 48px rgba(0,0,0,.22); }
  .homepage .search-result { border-color:var(--border); box-shadow:0 5px 20px rgba(28,63,120,.045); }
  .homepage .search-result:hover { background:var(--accent-soft); }
  .homepage .search-result strong { color:var(--link); }
  .homepage #mainContent > h2 { display:flex; align-items:center; gap:12px; }
  .homepage #mainContent > ol { box-shadow:0 8px 24px rgba(28,63,120,.035); }
  @media(max-width:640px) { .homepage .search-hero { margin-top:38px; } .homepage .brand { font-size:21px; } .homepage .brand img { width:30px; height:30px; } }

/* Warm, minimal encyclopedia homepage */
:root{--bg:#ffffff;--text:#111111;--text-secondary:#6f6b66;--border:#e6e3df;--border-light:#efedea;--card-bg:#ffffff;--link:#1f1d1b;--header-bg:rgba(255,255,255,.94);--code-bg:#f7f4ef;--search-bg:#fff;--accent-soft:#f4f0e9;--accent-strong:#292724}
html.dark{--bg:#151515;--text:#f2f0ec;--text-secondary:#aaa59d;--border:#34312d;--border-light:#292724;--card-bg:#1d1c1a;--link:#f2f0ec;--header-bg:rgba(21,21,21,.94);--code-bg:#242321;--search-bg:#1d1c1a;--accent-soft:#292724;--accent-strong:#f2f0ec}

.homepage .header-inner{max-width:1080px;height:54px;justify-content:flex-end;padding:8px 24px}
.homepage .brand{display:none}.homepage .header-actions{margin-left:auto}
.homepage .icon-btn{width:40px;height:40px;border:0;border-radius:50%}.homepage .icon-btn:hover{background:var(--accent-soft);color:var(--text)}
.homepage .container{max-width:980px;padding:0 22px 56px}
.homepage .search-hero{max-width:760px;margin:78px auto 46px;padding:0 8px}
.homepage .hero-wordmark{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(3.7rem,12vw,6.4rem);letter-spacing:-.075em;line-height:1.05;color:var(--text);margin-bottom:18px}
.homepage .hero-wordmark span{display:inline-block;font-family:"Noto Sans Devanagari",sans-serif;font-style:normal;font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--text-secondary);vertical-align:middle;margin-left:8px}
.homepage .search-hero .hero-title{font-size:clamp(1.45rem,4.8vw,2rem);line-height:1.45;font-weight:500;letter-spacing:-.025em;margin:0 0 8px}
.homepage .search-hero p{color:var(--text-secondary);font-size:15px;margin-bottom:34px}

html.dark .homepage .hero-search{box-shadow:0 8px 28px rgba(0,0,0,.16)}
.homepage .hero-search:focus-within{border-color:#aaa39a;box-shadow:0 0 0 3px rgba(120,110,95,.08)}
.homepage .hero-search input{font-size:17px;padding:12px 0}.homepage .hero-search input::placeholder{color:#9a958e}
.homepage .hero-search svg{color:var(--text-secondary);width:23px;height:23px}
.homepage .search-hint{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;margin-top:20px;color:var(--text-secondary);font-size:13px}
.homepage .search-hint a{color:var(--text);border:1px solid var(--border);border-radius:999px;padding:7px 14px;background:var(--card-bg);text-decoration:none}
.homepage .search-hint a:hover{background:var(--accent-soft)}
.homepage .search-results{max-width:760px;margin:0 auto 34px}.homepage .result-list{grid-template-columns:1fr;gap:8px}
.homepage .search-result{border-radius:14px;box-shadow:none}.homepage .search-result strong{color:var(--text)}
.homepage .search-result:hover{background:var(--accent-soft);border-color:var(--border)}

<style>

.homepage .header-inner>.hero-search input{font-size:14px;padding:7px 0;min-width:0}

<body class="homepage">
<header>
  <div class="header-inner">
    <a href="/" class="brand" aria-label="Factpedia मुख्यपृष्ठ"></a>
    <div class="header-actions">
      <button class="icon-btn" id="searchBtn" aria-label="Search">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
        </svg>
      </button>
      <button class="icon-btn" id="darkToggle" aria-label="Toggle theme">
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
        </svg>
        <svg id="icon-sun" style="display:none" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M3 12h2.25m.386-6.364 1.591 1.591M12 12a2.25 2.25 0 0 0-2.25 2.25 2.25 2.25 0 0 0 2.25 2.25 2.25 2.25 0 0 0 2.25-2.25A2.25 2.25 0 0 0 12 12Z" />
        </svg>
      </button>
    </div>
  </div>
</header>

<div class="container">
  <section class="search-hero" aria-label="Factpedia article search">
    <div class="hero-wordmark">Factpedia <span class="version">v0.1</span></div>
    <p class="hero-tagline">आज तुम्हाला काय जाणून घ्यायचे आहे?</p>
    <div class="hero-search">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><path stroke-linecap="round" stroke-linejoin="round" d="m16.5 16.5 4 4"/></svg>
      <input id="searchInput" type="search" placeholder="काहीही शोधा किंवा प्रश्न विचारा..." autocomplete="off" aria-label="Search Factpedia articles">
      <button type="button" class="hero-search-go" id="searchGo" aria-label="शोध सुरू करा">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
      </button>
    </div>
    <div class="search-hint"><span>ट्रेंडिंग</span><a href="/bharat/">भारत</a><a href="/artificial-intelligence/">कृत्रिम बुद्धिमत्ता</a><a href="/chandrayaan-3/">चांद्रयान-३</a></div>
  </section>
  <section class="search-results" id="searchResults" aria-live="polite" hidden>
    <p class="results-heading" id="searchMeta"></p>
    <div class="result-list" id="resultList"></div>
  </section>
  <div class="home-version" aria-label="Website version">Factpedia</div>
  <main id="mainContent">
    {{content}}
  </main>
  <div class="no-results" id="noResults">कोणतेही परिणाम सापडले नाहीत 😕</div>
  <footer>© 2026 Factpedia • सर्व ज्ञानाचा एक खुला संग्रह</footer>
</div>

<script>
  (function() {
    const html = document.documentElement;
    const darkBtn = document.getElementById('darkToggle');
    const moon = document.getElementById('icon-moon');
    const sun = document.getElementById('icon-sun');
    const searchBtn = document.getElementById('searchBtn');
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const searchMeta = document.getElementById('searchMeta');
    const resultList = document.getElementById('resultList');
    const saved = localStorage.getItem('factpedia-theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    function applyTheme(isDark) {
      html.classList.toggle('dark', isDark);
      moon.style.display = isDark ? 'none' : 'block';
      sun.style.display = isDark ? 'block' : 'none';
    }
    applyTheme(saved ? saved === 'dark' : prefersDark);
    darkBtn.addEventListener('click', () => {
      const isDark = !html.classList.contains('dark');
      applyTheme(isDark);
      localStorage.setItem('factpedia-theme', isDark ? 'dark' : 'light');
    });
    searchBtn.addEventListener('click', () => {
      searchInput.focus();
      searchInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    let documents = [];
    let prepared = [];
    let prefixIndex = new Map();
    let bodyPrefixIndex = new Map();
    let indexReady = false;
    const MAX_PREFIX = 10;
    fetch('/search-index.json')
      .then(response => { if (!response.ok) throw new Error('Search index unavailable'); return response.json(); })
      .then(data => { documents = Array.isArray(data) ? data : []; buildIndex(); indexReady = true; if (searchInput.value.trim()) renderSearch(searchInput.value); })
      .catch(() => { searchMeta.textContent = 'शोध निर्देशांक सध्या उपलब्ध नाही. कृपया पृष्ठ पुन्हा उघडा.'; });
    const normalize = value => String(value || '').toLocaleLowerCase('en').normalize('NFKC')
      .replace(/[’']/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
    // Pre-compute normalised fields and a prefix index once, so typing never
    // re-normalises 500+ documents on every keystroke.
    function buildIndex() {
      prepared = documents.map(doc => {
        const title = normalize(doc.title);
        const aliases = normalize((doc.aliases || []).join(' '));
        const slug = normalize(String(doc.slug || '').replace(/-/g, ' '));
        const description = normalize(doc.description);
        const text = normalize(doc.text);
        const heads = new Set([...title.split(' '), ...aliases.split(' '), ...slug.split(' ')].filter(Boolean));
        return { doc, title, aliases, slug, description, text, heads };
      });
      prefixIndex = new Map();
      bodyPrefixIndex = new Map();
      prepared.forEach((entry, i) => {
        entry.heads.forEach(token => {
          const limit = Math.min(token.length, MAX_PREFIX);
          for (let len = 1; len <= limit; len++) {
            const key = token.slice(0, len);
            const bucket = prefixIndex.get(key);
            if (bucket) bucket.push(i); else prefixIndex.set(key, [i]);
          }
        });
        const indexedPrefixes = new Set();
        for (const token of entry.text.split(/\\s+/)) {
          const chars = Array.from(token);
          if (chars.length < 3) continue;
          const key = chars.slice(0, 3).join('');
          if (indexedPrefixes.has(key)) continue;
          indexedPrefixes.add(key);
          const bucket = bodyPrefixIndex.get(key);
          if (bucket) bucket.push(i); else bodyPrefixIndex.set(key, [i]);
        }
      });
    }
    function scoreEntry(entry, q, tokens) {
      const { title, aliases, slug, description, text } = entry;
      let score = 0;
      if (title === q) score += 160;
      if (title.startsWith(q)) score += 90;
      if (title.includes(q)) score += 80;
      if (aliases.includes(q)) score += 65;
      if (slug.includes(q)) score += 45;
      if (description.includes(q)) score += 25;
      if (text.includes(q)) score += 12;
      let matched = 0;
      for (const token of tokens) {
        if (entry.heads.has(token)) matched += 2;
        else if (title.includes(token) || aliases.includes(token) || slug.includes(token) || description.includes(token) || text.includes(token)) matched += 1;
      }
      if (matched >= tokens.length * 2) score += 40;
      else if (matched > 0) score += matched * 3;
      return score;
    }
    function candidateIds(tokens) {
      // Search every query term. Returning only the smallest bucket caused
      // multi-word searches to miss articles matching another term.
      const candidates = new Set();
      let foundBucket = false;
      for (const token of tokens) {
        const key = Array.from(token).slice(0, MAX_PREFIX).join('');
        const bodyKey = Array.from(token).slice(0, 3).join('');
        const headBucket = prefixIndex.get(key);
        const bodyBucket = Array.from(token).length >= 3 ? bodyPrefixIndex.get(bodyKey) : null;
        for (const bucket of [headBucket, bodyBucket]) {
          if (!bucket) continue;
          foundBucket = true;
          for (const id of bucket) candidates.add(id);
        }
      }
      return foundBucket ? candidates : null;
    }
    function renderSearch(query) {
      const q = query.trim();
      if (!q) {
        searchResults.hidden = true;
        resultList.replaceChildren();
        return;
      }
      searchResults.hidden = false;
      if (!indexReady) {
        searchMeta.textContent = 'लेख शोधले जात आहेत...';
        return;
      }
      const normalizedQuery = normalize(q);
      const tokens = normalizedQuery.split(' ').filter(Boolean);
      if (!tokens.length) { searchMeta.textContent = 'शोधण्यासाठी अक्षरे किंवा शब्द टाइप करा.'; resultList.replaceChildren(); return; }
      const candidates = candidateIds(tokens);
      const pool = candidates && candidates.size ? candidates : prepared.map((_, i) => i);
      const results = [];
      for (const i of pool) {
        const entry = prepared[i];
        if (!entry) continue;
        const score = scoreEntry(entry, normalizedQuery, tokens);
        if (score > 0) results.push({ doc: entry.doc, score });
      }
      results.sort((a, b) => b.score - a.score || a.doc.title.localeCompare(b.doc.title, 'mr'));
      results.length = Math.min(results.length, 12);
      searchMeta.textContent = results.length
        ? '“' + q + '” साठी ' + results.length + ' संबंधित लेख'
        : '“' + q + '” साठी लेख सापडला नाही. वेगळा शब्द वापरून पाहा.';
      resultList.replaceChildren();
      results.forEach(({doc}) => {
        const link = document.createElement('a');
        link.className = 'search-result';
        link.href = doc.url;
        const title = document.createElement('strong');
        title.textContent = doc.title;
        const desc = document.createElement('span');
        desc.textContent = doc.description || 'Factpedia वरील माहितीपूर्ण लेख वाचा.';
        link.append(title, desc);
        resultList.append(link);
      });
    }
    let pendingFrame = 0;
    searchInput.addEventListener('input', event => {
      const value = event.target.value;
      if (pendingFrame) cancelAnimationFrame(pendingFrame);
      pendingFrame = requestAnimationFrame(() => {
        pendingFrame = 0;
        renderSearch(value);
      });
    });
    searchInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') { if (pendingFrame) cancelAnimationFrame(pendingFrame); pendingFrame = 0; renderSearch(searchInput.value); }
    });
    const searchGo = document.getElementById('searchGo');
    if (searchGo) searchGo.addEventListener('click', () => {
      if (searchInput.value.trim()) { renderSearch(searchInput.value); searchResults.scrollIntoView({behavior:'smooth',block:'start'}); }
      else searchInput.focus();
    });
    document.addEventListener('keydown', event => {
      if (event.key === '/' && !event.target.matches('input,textarea')) {
        event.preventDefault(); searchInput.focus();
      }
      if (event.key === 'Escape' && document.activeElement === searchInput) {
        searchInput.value = ''; renderSearch('');
      }
    });
  })();
</script>


<script>
(function(){
 const body=document.body, header=document.querySelector('header'), inner=header&&header.querySelector('.header-inner');
 if(!header||!inner)return;
 const ns='http://www.w3.org/2000/svg';
 function icon(path){const s=document.createElementNS(ns,'svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('fill','none');s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width','1.8');s.setAttribute('stroke-linecap','round');s.setAttribute('stroke-linejoin','round');const p=document.createElementNS(ns,'path');p.setAttribute('d',path);s.appendChild(p);return s;}
 const menu=document.createElement('button');menu.className='fp-menu-button';menu.type='button';menu.setAttribute('aria-label','मुख्य मेनू');menu.setAttribute('aria-expanded','false');menu.appendChild(icon('M4 6h16M4 12h16M4 18h16'));inner.insertBefore(menu,inner.firstChild);
 const brand=inner.querySelector('.brand');
 if(brand && !brand.textContent.trim()){const img=document.createElement('img');img.src='/favicon.svg';img.alt='';img.width=36;img.height=36;brand.append(img,document.createTextNode('Factpedia'));}
 if(brand && !brand.querySelector('img')){const img=document.createElement('img');img.src='/favicon.svg';img.alt='';img.width=36;img.height=36;brand.prepend(img);}
 const sidebar=document.createElement('aside');sidebar.className='fp-wiki-sidebar';sidebar.id='fpWikiSidebar';
 sidebar.innerHTML='<div class="fp-sidebar-brand"><img src="/favicon.svg" alt="">Factpedia</div><div class="fp-nav-label">नेव्हिगेशन</div><a href="/" class="'+(body.classList.contains('homepage')?'fp-nav-current':'')+'">मुख्यपृष्ठ</a><a href="/#mainContent">सर्व लेख</a><div class="fp-nav-label">वाचन</div><a href="#mainContent">लेखाचा मजकूर</a><a href="#article-toc">अनुक्रमणिका</a><div class="fp-nav-label">Factpedia</div><a href="https://github.com/shravan-info/factpedia-mr" target="_blank" rel="noopener">प्रकल्प माहिती</a>';
 body.appendChild(sidebar);
 const scrim=document.createElement('div');scrim.className='fp-sidebar-scrim';body.appendChild(scrim);
 function closeMenu(){body.classList.remove('fp-sidebar-open');menu.setAttribute('aria-expanded','false');}
 menu.addEventListener('click',()=>{const open=body.classList.toggle('fp-sidebar-open');menu.setAttribute('aria-expanded',String(open));});
 scrim.addEventListener('click',closeMenu);
 sidebar.querySelectorAll('a').forEach(a=>a.addEventListener('click',closeMenu));
 const actions=inner.querySelector('.header-actions');
 const searchWrap=document.getElementById('searchWrap');
 const searchBtn=document.getElementById('searchBtn');
 if(searchWrap && actions){inner.insertBefore(searchWrap,actions);if(searchBtn)searchBtn.addEventListener('click',()=>{searchWrap.classList.toggle('open');});}
 if(body.classList.contains('homepage')){
   const hero=document.querySelector('.search-hero'), search=document.querySelector('.hero-search');
   if(hero && search){const tagline=hero.querySelector('.hero-tagline');if(tagline)tagline.textContent='मुक्त ज्ञानाचा मराठी ज्ञानकोश';const actions=inner.querySelector('.header-actions');if(actions)inner.insertBefore(search,actions);}
 }else{
   const main=document.getElementById('mainContent');
   if(main){
     const h1=main.querySelector(':scope > h1');
     if(h1){
       const tabs=document.createElement('nav');tabs.className='fp-page-tabs';tabs.setAttribute('aria-label','लेख पर्याय');
       tabs.innerHTML='<a class="active" href="#mainContent">लेख</a><a href="#article-toc">अनुक्रमणिका</a><span class="fp-tabs-spacer"></span><span class="fp-page-subtitle">Factpedia मधील लेख</span>';
       h1.insertAdjacentElement('afterend',tabs);
     }
     const toc=document.querySelector('.article-toc');if(toc)toc.id='article-toc';
     const panel=document.createElement('div');panel.className='fp-tool-panel';
     panel.innerHTML='<strong>साधने</strong><button type="button" data-fp-action="print">मुद्रण / PDF</button><button type="button" data-fp-action="copy">लेखाचा दुवा कॉपी करा</button>';
     if(toc)toc.appendChild(panel);
     panel.addEventListener('click',async e=>{
       const b=e.target.closest('button');if(!b)return;
       if(b.dataset.fpAction==='print')window.print();
       if(b.dataset.fpAction==='copy'){try{await navigator.clipboard.writeText(location.href);b.textContent='दुवा कॉपी झाला';}catch(_){b.textContent='दुवा: '+location.href;}}
     });
   }
 }
})();
</script>

</body>
</html>
